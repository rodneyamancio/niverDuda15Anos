# Produção: docker compose -f docker-compose.prod.yml up -d --build
# Requer um arquivo .env ao lado (veja DEPLOY.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: niver_duda
    volumes:
      - pgdata:/var/lib/postgresql/data
    # sem "ports": o banco só é acessível pela rede interna do compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duda -d niver_duda"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://duda:${POSTGRES_PASSWORD}@db:5432/niver_duda?schema=public

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://duda:${POSTGRES_PASSWORD}@db:5432/niver_duda?schema=public
    ports:
      # expõe só no localhost do servidor; o Nginx faz o proxy HTTPS
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://duda:${POSTGRES_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR
    volumes:
      - evolution_instances:/evolution/instances
    # sem "ports": o app fala com ele pela rede interna (http://evolution:8080)

volumes:
  pgdata:
  evolution_instances:
