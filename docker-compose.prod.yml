# Produção: docker compose -f docker-compose.prod.yml up -d --build
# Requer um arquivo .env ao lado (veja DEPLOY.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: niver_duda
    volumes:
      - pgdata:/var/lib/postgresql/data
    # sem "ports": o banco só é acessível pela rede interna do compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duda -d niver_duda"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://duda:${POSTGRES_PASSWORD}@db:5432/niver_duda?schema=public

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://duda:${POSTGRES_PASSWORD}@db:5432/niver_duda?schema=public
    ports:
      # expõe só no localhost do servidor; o Nginx faz o proxy HTTPS
      - "127.0.0.1:${APP_PORT:-3010}:3000"

volumes:
  pgdata:
